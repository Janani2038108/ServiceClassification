# --- SQL queries ---
# Use placeholder __PROJECTS__ for the comma-separated list of eligible project ids.
[QUERY]
TicketQuery = Select TicketID,a.ProjectID,TicketDescription,ResolutionRemarks,a.OpenDateTime,TicketSummary,Comments,FlexField1,FlexField2,FlexField3,FlexField4,Category,
    A.CausecodeMapID,CC.CauseCode,A.ResolutionCodeMapID,RC.ResolutionCode,a.TicketTypeMapID
    from avl.tk_trn_ticketdetail (NOLOCK) a
    LEFT Join [AVL].[DEBT_MAP_CauseCode] (NOLOCK) CC ON CC.CauseID=A.CausecodeMapID and CC.ProjectID=A.ProjectID
    LEFT JOIN [AVL].[DEBT_MAP_ResolutionCode] (NOLOCK) RC ON RC.ResolutionID=A.ResolutionCodeMapID and RC.ProjectID=A.ProjectID
    where A.ProjectID IN (__PROJECTS__) AND ServiceClassificationMode=19
    AND a.IsDeleted=0  AND (IsNull(TicketDescription,'')<>'' OR IsNull(ResolutionRemarks,'')<>'' OR IsNull(TicketSummary,'') <> ''
    OR IsNull(Comments,'') <> ''  OR IsNull(FlexField1,'') <>'' OR IsNull(FlexField2,'') <>'' OR IsNull(FlexField3,'') <>''
    OR IsNull(FlexField4,'') <>'' OR IsNull(Category,'') <>'' OR IsNull(CauseCode,'') <>'' OR IsNull(ResolutionCode,'') <>'')  AND IsNull(ServiceId,0)=0
    order by a.OpenDateTime desc

